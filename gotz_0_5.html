<title>Gotz 0.5</title>
<style>
:root{color-scheme:light dark;--surface-1:#ffffff;--text-primary:#111110;--text-secondary:#4a4944;--text-accent:#0C447C;--accent-fill:#0C447C;--on-accent:#ffffff;--border-strong:#2c2c2a;--ghost:#f1efe8;}

button:focus-visible{outline:2px solid var(--text-accent);outline-offset:2px;}
button[aria-pressed="true"]{background:var(--accent-fill);color:var(--on-accent);border-color:var(--accent-fill);}
input[type=range]{accent-color:var(--text-accent);}
label{font-size:14px;color:var(--text-secondary);font-weight:500;}
</style>
</head>
<body>
<svg id="s" viewBox="-180 0 730 440" width="100%" role="img" style="touch-action:none;display:block">
<title>Gotz 0.5 hand</title>
<desc>Four fingers and a thumb hanging from one shared wrist joint, with bone art from the uploaded PNGs. Math comes from the shared hub.</desc>
<rect x="-180" y="0" width="730" height="440" fill="transparent"/>
<path id="range" fill="none" stroke="var(--border-strong)" stroke-width="0.5" stroke-dasharray="2 3"/>
<g id="hand"></g>
</svg>
<div style="display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;">
<button id="fIndex" aria-pressed="false">Index</button>
<button id="fBird" aria-pressed="false">Bird</button>
<button id="fRing" aria-pressed="false">Ring</button>
<button id="fPinky" aria-pressed="false">Pinky</button>
<button id="fThumb" aria-pressed="false">Thumb</button>
</div>
<div style="display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0;">
<button id="bMeta" aria-pressed="false">Metacarpal</button>
<button id="bFin" aria-pressed="false">Whole finger</button>
<button id="bProx" aria-pressed="false">Proximal</button>
<button id="bC1" aria-pressed="false" style="display:none;">Carpal 1</button>
<button id="bC2" aria-pressed="false" style="display:none;">Carpal 2</button>
<button id="bMid" aria-pressed="false">Middle</button>
<button id="bDist" aria-pressed="false">Distal</button>
</div>
<div style="display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0;">
<button id="bGrip" aria-pressed="false">Grip: off</button>
<button id="g05" aria-pressed="true" style="display:none;">Grip 0.125</button>
<button id="g1" aria-pressed="false" style="display:none;">Grip 0.25</button>
</div>
<div id="menu" style="display:none;">
<div id="sidesRow" style="display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;">
<button id="sLeft" aria-pressed="false">Left</button>
<button id="sRight" aria-pressed="false">Right</button>
<button id="sFront" aria-pressed="false">Front</button>
<button id="sBack" aria-pressed="false">Back</button>
</div>
<div id="rulesRow" style="display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0;">
<button id="bReal" aria-pressed="false">Real (92.5°)</button>
<button id="bElastic" aria-pressed="false">Elastic (135°)</button>
<button id="b360" aria-pressed="false">360°: off</button>
<button id="bFlicker" aria-pressed="false">Flicker: off</button>
</div>
<div style="display:flex;align-items:center;gap:12px;margin:12px 0 0;">
<label for="sl">Angle</label>
<input type="range" id="sl" min="-92.5" max="0" step="0.5" value="0" style="flex:1;" />
</div>

<label for="fi">Flicker intensity</label>
<input type="range" id="fi" min="0" max="100" step="1" value="30" style="flex:1;" />
</div>

const fi = document.getElementById('fi');
const readout = document.getElementById('readout');
const fbtn = {index:document.getElementById('fIndex'), middle:document.getElementById('fBird'), ring:document.getElementById('fRing'), pinky:document.getElementById('fPinky'), thumb:document.getElementById('fThumb')};
const bbtn = {meta:document.getElementById('bMeta'), fin:document.getElementById('bFin'), prox:document.getElementById('bProx'), c1:document.getElementById('bC1'), c2:document.getElementById('bC2'), mid:document.getElementById('bMid'), dist:document.getElementById('bDist')};
const sides = {left:document.getElementById('sLeft'), right:document.getElementById('sRight'), front:document.getElementById('sFront'), back:document.getElementById('sBack')};
const bReal = document.getElementById('bReal');
const bElastic = document.getElementById('bElastic');
const b360 = document.getElementById('b360');
const bFlicker = document.getElementById('bFlicker');
let selF = null, selB = null, sel = null, drag = null, t = 0, gripOn = false, gripLevel = LEVEL_A;
function computeSel() { const id = (selF && selB) ? selF+'.'+selB : null; return (id && S[id]) ? id : null; }
function wrap(a) { return ((a+180)%360+360)%360-180; }
function boneOf(id) { return id.split('.')[1]; }
function isCarpal(id) { const b = boneOf(id); return b === 'c1' || b === 'c2'; }
function bounds(id) {
  const s = S[id], b = boneOf(id);
  if (b === 'c1') return [-LIM.thumb_c1_deg, 0];
  if (b === 'c2') return [-LIM.thumb_c1_deg - S['thumb.c1'].angle, 0];
  if (b === 'meta') {
    if (s.side === 'front' || s.side === 'back') return [-LIM.meta_front_back_deg, LIM.meta_front_back_deg];
    return s.side === 'left' ? [-LIM.meta_lateral_deg, 0] : [0, LIM.meta_lateral_deg];
  }
  if (s.use360) return [-180, 180];
  if (s.side === 'front' || s.side === 'back') return [-LIM.front_back_deg, LIM.front_back_deg];
  const L = s.mode === 'elastic' ? LIM.elastic_deg : LIM.real_deg;
  return s.side === 'left' ? [-L, 0] : [0, L];
}
function snap(id, a) {
  const s = S[id], bd = bounds(id);
  if (boneOf(id) === 'meta' || isCarpal(id)) return Math.max(bd[0], Math.min(bd[1], a));
  if (s.use360) return wrap(a);
  const sg = a < 0 ? -1 : 1;
  let m = Math.abs(a);
  const lateral = s.side === 'left' || s.side === 'right';
  if (lateral && s.mode === 'elastic' && m > LIM.real_deg) {
    const d = LIM.elastic_detents_deg;
    m = m < (d[0]+d[1])/2 ? d[0] : (m < (d[1]+d[2])/2 ? d[1] : d[2]);
  }
  return Math.max(bd[0], Math.min(bd[1], sg*m));
}
function rot(p, c, deg) {
  const r = deg*Math.PI/180, dx = p[0]-c[0], dy = p[1]-c[1];
  return [c[0]+dx*Math.cos(r)-dy*Math.sin(r), c[1]+dx*Math.sin(r)+dy*Math.cos(r)];
}
function effAngle(id) { return S[id].angle + REST[id]; }
function sumAnc(id) { return ANC[id].reduce((a, x) => a + effAngle(x), 0); }
function gPivot(id) { let p = PIV[id]; ANC[id].forEach(a => { p = rot(p, PIV[a], effAngle(a)); }); return p; }
function pt(c, r, deg) { const q = deg*Math.PI/180; return [c[0]-r*Math.sin(q), c[1]+r*Math.cos(q)]; }
function drawRange() {
  if (!sel) { rangeEl.setAttribute('d', ''); return; }
  const c = gPivot(sel), R = 50, base = sumAnc(sel)+REST[sel];
  if (S[sel].use360) { rangeEl.setAttribute('d', 'M'+c[0]+' '+(c[1]-R)+' A '+R+' '+R+' 0 1 1 '+c[0]+' '+(c[1]+R)+' A '+R+' '+R+' 0 1 1 '+c[0]+' '+(c[1]-R)+' Z'); return; }
  const bd = bounds(sel);
  const p1 = pt(c, R, base+bd[0]), p2 = pt(c, R, base+bd[1]);
  const large = (bd[1]-bd[0]) > 180 ? 1 : 0;
  rangeEl.setAttribute('d', 'M'+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+' A '+R+' '+R+' 0 '+large+' 1 '+p2[0].toFixed(1)+' '+p2[1].toFixed(1));
}
function cap(s) { return s.charAt(0).toUpperCase()+s.slice(1); }
function updateUI() {
  sel = computeSel();
  const isThumb = selF === 'thumb';
  Object.keys(fbtn).forEach(f => fbtn[f].setAttribute('aria-pressed', selF === f));
  Object.keys(bbtn).forEach(b => bbtn[b].setAttribute('aria-pressed', selB === b));
  bbtn.meta.style.display = isThumb ? 'none' : 'inline-block';
  bbtn.fin.style.display = isThumb ? 'none' : 'inline-block';
  bbtn.prox.style.display = isThumb ? 'none' : 'inline-block';
  bbtn.c1.style.display = isThumb ? 'inline-block' : 'none';
  bbtn.c2.style.display = isThumb ? 'inline-block' : 'none';
  document.querySelectorAll('[data-bone]').forEach(e => {
    const id = e.dataset.bone;
    let hot = id === sel;
    if (!hot && selF && selB === 'fin' && id.indexOf(selF+'.') === 0) hot = true;
    if (e.tagName === 'image') e.style.opacity = (selF && selB) ? (hot ? 1 : 0.55) : 1;
    else e.style.stroke = hot ? 'var(--text-accent)' : 'var(--text-primary)';
  });
  bGrip.setAttribute('aria-pressed', gripOn);
  bGrip.textContent = 'Grip: ' + (gripOn ? 'on' : 'off');
  g05.style.display = gripOn ? 'inline-block' : 'none';
  g1.style.display = gripOn ? 'inline-block' : 'none';
  g05.textContent = 'Grip ' + LEVEL_A;
  g1.textContent = 'Grip ' + LEVEL_B;
  g05.setAttribute('aria-pressed', gripLevel === LEVEL_A);
  g1.setAttribute('aria-pressed', gripLevel === LEVEL_B);
  menu.style.display = sel ? 'block' : 'none';
  if (sel) {
    const s = S[sel], bd = bounds(sel);
    const carp = isCarpal(sel), meta = boneOf(sel) === 'meta';
    sidesRow.style.display = carp ? 'none' : 'flex';
    rulesRow.style.display = (carp || meta) ? 'none' : 'flex';
    Object.keys(sides).forEach(k => sides[k].setAttribute('aria-pressed', s.side === k));
    bReal.setAttribute('aria-pressed', s.mode === 'real');
    bElastic.setAttribute('aria-pressed', s.mode === 'elastic');
    b360.setAttribute('aria-pressed', s.use360);
    b360.textContent = '360°: ' + (s.use360 ? 'on' : 'off');
    bFlicker.setAttribute('aria-pressed', s.flicker);
    bFlicker.textContent = 'Flicker: ' + (s.flicker ? 'on' : 'off');
    intRow.style.display = (s.flicker && !carp && !meta) ? 'flex' : 'none';
    sl.min = bd[0]; sl.max = bd[1];
    sl.value = Math.round(s.angle*10)/10;
    fi.value = s.intensity;
    const gtxt = gripOn ? ' · Grip ' + gripLevel + ' driven' : '';
    readout.textContent = FNAME[selF] + ' · ' + NAME[selB] + gtxt + ' · Side ' + cap(s.side) + ' · Angle ' + (Math.round(s.angle*10)/10) + '° · Range ' + (s.use360 ? '360°' : (Math.round(bd[0]*10)/10 + '° to ' + Math.round(bd[1]*10)/10 + '°')) + (s.flicker ? ' · Flicker on' : '');
  } else {
    readout.textContent = selF ? FNAME[selF] + ': choose a bone' : 'Gotz 0.5 · Select a finger and a bone';
  }
  drawRange();
}
function render() {
  const self = {};
  ids.forEach(id => {
    const s = S[id];
    let v = s.angle;
    if (s.flicker && drag !== id) { const amp = 0.2 + (s.intensity/100)*1.3; v += (Math.sin(t*0.9)*0.7 + Math.sin(t*2.3)*0.35)*(amp/1.05); }
    if (s.use360) v = wrap(v);
    else { const bd = bounds(id); v = Math.max(bd[0], Math.min(bd[1], v)); }
    self[id] = v;
  });
  const driver = gripOn ? (drag || sel) : null;
  ids.forEach(id => {
    let v = self[id];
    if (driver && id !== driver) { v += gripLevel*self[driver]; const bd = bounds(id); v = Math.max(bd[0], Math.min(bd[1], v)); }
    const p = PIV[id];
    GROUP[id].setAttribute('transform', 'rotate(' + (v+REST[id]).toFixed(2) + ' ' + p[0] + ' ' + p[1] + ')');
  });
}
function frame() { t += 0.15; render(); requestAnimationFrame(frame); }
const svg = document.getElementById('s');
function setAngleFromEvent(e) {
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  const q = p.matrixTransform(svg.getScreenCTM().inverse());
  const c = gPivot(drag);
  const abs = Math.atan2(-(q.x-c[0]), q.y-c[1])*180/Math.PI;
  S[drag].angle = snap(drag, abs - sumAnc(drag) - REST[drag]);
  updateUI();
}
svg.addEventListener('pointerdown', function(e) {
  ids.forEach(id => { S[id].flicker = false; });
  const target = e.target.closest('[data-bone]');
  if (target) {
    const hit = target.dataset.bone, hf = hit.split('.')[0];
    if (sel && sel === hf+'.fin') drag = sel;
    else { selF = hf; selB = boneOf(hit); drag = hit; }
    svg.setPointerCapture(e.pointerId);
    setAngleFromEvent(e);
  } else {
    selF = null; selB = null; drag = null;
    updateUI();
  }
});
svg.addEventListener('pointermove', function(e) { if (drag) setAngleFromEvent(e); });
svg.addEventListener('pointerup', function() { drag = null; updateUI(); });
svg.addEventListener('pointercancel', function() { drag = null; updateUI(); });
Object.keys(fbtn).forEach(f => fbtn[f].addEventListener('click', function() { selF = f; updateUI(); }));
Object.keys(bbtn).forEach(b => bbtn[b].addEventListener('click', function() { selB = b; updateUI(); }));
bGrip.addEventListener('click', function() { gripOn = !gripOn; updateUI(); });
g05.addEventListener('click', function() { gripLevel = LEVEL_A; updateUI(); });
g1.addEventListener('click', function() { gripLevel = LEVEL_B; updateUI(); });
Object.keys(sides).forEach(k => sides[k].addEventListener('click', function() { if (!sel) return; S[sel].side = k; S[sel].angle = snap(sel, S[sel].angle); updateUI(); }));
bReal.addEventListener('click', function() { if (!sel) return; S[sel].mode = 'real'; S[sel].angle = snap(sel, S[sel].angle); updateUI(); });
bElastic.addEventListener('click', function() { if (!sel) return; S[sel].mode = 'elastic'; S[sel].angle = snap(sel, S[sel].angle); updateUI(); });
b360.addEventListener('click', function() { if (!sel) return; S[sel].use360 = !S[sel].use360; S[sel].angle = snap(sel, S[sel].angle); updateUI(); });
bFlicker.addEventListener('click', function() { if (!sel) return; S[sel].flicker = !S[sel].flicker; updateUI(); });
fi.addEventListener('input', function() { if (sel) S[sel].intensity = Number(this.value); });
sl.addEventListener('input', function() { if (!sel) return; S[sel].angle = snap(sel, Number(this.value)); updateUI(); });
updateUI();
requestAnimationFrame(frame);
</script>
</body>
